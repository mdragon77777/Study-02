<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 관리</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>오늘 할 일</h1>
    </header>

    <!-- 입력 -->
    <form id="todo-form" class="todo-form" autocomplete="off">
      <label for="todo-input" class="visually-hidden">할 일 내용</label>
      <input
        type="text"
        id="todo-input"
        class="todo-input"
        placeholder="할 일을 입력하세요"
        maxlength="100"
        required
      >
      <label for="todo-category" class="visually-hidden">카테고리</label>
      <select id="todo-category" class="todo-category">
        <option value="work">업무</option>
        <option value="personal">개인</option>
        <option value="study">공부</option>
      </select>
      <button type="submit" class="btn btn-primary">추가</button>
    </form>

    <!-- 진행률 -->
    <section class="progress" aria-labelledby="progress-title">
      <h2 id="progress-title" class="visually-hidden">진행률</h2>

      <div class="progress-total">
        <div class="progress-label">
          <span>전체</span>
          <span id="progress-total-text">0 / 0 (0%)</span>
        </div>
        <div class="progress-bar" role="progressbar" aria-label="전체 진행률"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-fill" id="progress-total-fill" style="width: 0%"></div>
        </div>
        <p id="progress-hint" class="progress-hint">할 일을 추가하면 진행률이 표시됩니다.</p>
      </div>

      <ul class="progress-categories">
        <li class="progress-category" data-category="work">
          <div class="progress-label">
            <span class="badge badge-work">업무</span>
            <span class="progress-cat-text">0 / 0 (0%)</span>
          </div>
          <div class="progress-bar progress-bar-sm" role="progressbar" aria-label="업무 진행률"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress-fill fill-work" style="width: 0%"></div>
          </div>
        </li>
        <li class="progress-category" data-category="personal">
          <div class="progress-label">
            <span class="badge badge-personal">개인</span>
            <span class="progress-cat-text">0 / 0 (0%)</span>
          </div>
          <div class="progress-bar progress-bar-sm" role="progressbar" aria-label="개인 진행률"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress-fill fill-personal" style="width: 0%"></div>
          </div>
        </li>
        <li class="progress-category" data-category="study">
          <div class="progress-label">
            <span class="badge badge-study">공부</span>
            <span class="progress-cat-text">0 / 0 (0%)</span>
          </div>
          <div class="progress-bar progress-bar-sm" role="progressbar" aria-label="공부 진행률"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress-fill fill-study" style="width: 0%"></div>
          </div>
        </li>
      </ul>
    </section>

    <!-- 필터 탭 -->
    <nav class="filters" role="tablist" aria-label="카테고리 필터">
      <button type="button" class="filter-tab is-active" role="tab" aria-selected="true" data-filter="all">전체</button>
      <button type="button" class="filter-tab" role="tab" aria-selected="false" data-filter="work">업무</button>
      <button type="button" class="filter-tab" role="tab" aria-selected="false" data-filter="personal">개인</button>
      <button type="button" class="filter-tab" role="tab" aria-selected="false" data-filter="study">공부</button>
    </nav>

    <!-- 목록 -->
    <section class="list-section" aria-label="할 일 목록">
      <ul id="todo-list" class="todo-list"></ul>
      <p id="empty-state" class="empty-state" hidden>오늘 할 일을 추가해 보세요</p>
    </section>

    <!-- 하단 도구 -->
    <footer class="app-footer">
      <button type="button" id="clear-done" class="btn btn-secondary">완료 항목 삭제</button>
      <p class="storage-notice">
        데이터는 이 브라우저(localStorage)에만 저장됩니다. 브라우저 데이터를 삭제하거나 시크릿 모드를 쓰면 사라집니다.
      </p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
